name: Build OCR Server Launcher

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-launcher:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: >
          pyinstaller --onedir --windowed --name "EZI OCR Server Launcher"
          --add-data "ocr_server.py;."
          --add-data "requirements.txt;."
          server_launcher.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZI-OCR-Server-Launcher-Windows
          path: dist/EZI OCR Server Launcher
          if-no-files-found: error
